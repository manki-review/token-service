name = "manki-token-service"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "manki-api.dustinface.me/*", zone_name = "dustinface.me" }
]

[[durable_objects.bindings]]
name = "PR_COORDINATOR"
class_name = "PrCoordinator"

[[durable_objects.bindings]]
name = "RECONCILER"
class_name = "Reconciler"

[[durable_objects.bindings]]
name = "INSTALLATION_LIMITER"
class_name = "InstallationLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reconciler"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["InstallationLimiter"]

# The `/token` and `/state` requests of one account. A Manki run makes a handful.
[[ratelimits]]
name = "ACCOUNT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["*/5 * * * *"]

[vars]
DISPATCH_ENABLED = "true"
# Off until a deploy with waiting checks is known good. Turning it off again stops new ones, and open ones still end.
WAITING_CHECK_ENABLED = "false"
# The manki-review and dashpay organizations and the xdustinface user.
WEBHOOK_ACCOUNTS = "270828077,35775977,11511719"
MEMORY_REPO = "manki-review/review-memory"

[observability]
enabled = true
