name = "manki-token-service"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "manki-api.dustinface.me/*", zone_name = "dustinface.me" }
]

[[durable_objects.bindings]]
name = "PR_COORDINATOR"
class_name = "PrCoordinator"

[[durable_objects.bindings]]
name = "RECONCILER"
class_name = "Reconciler"

[[durable_objects.bindings]]
name = "INSTALLATION_LIMITER"
class_name = "InstallationLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reconciler"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["InstallationLimiter"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
DISPATCH_ENABLED = "true"
# manki-review/manki, manki-review/token-service, manki-review/review-memory and xdustinface/rust-dashcore.
WEBHOOK_REPOS = "1190216666,1202459902,1202454534,1093229150"

[observability]
enabled = true
