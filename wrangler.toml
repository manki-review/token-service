name = "manki-token-service"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "manki-api.dustinface.me/*", zone_name = "dustinface.me" }
]

[[durable_objects.bindings]]
name = "PR_COORDINATOR"
class_name = "PrCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrCoordinator"]

[vars]
DISPATCH_ENABLED = "false"
# manki-review/manki, manki-review/token-service and manki-review/review-memory.
WEBHOOK_REPOS = "1190216666,1202459902,1202454534"

[observability]
enabled = true
