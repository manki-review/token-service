name = "manki-token-service"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "manki-api.dustinface.me/*", zone_name = "dustinface.me" }
]

[[durable_objects.bindings]]
name = "PR_COORDINATOR"
class_name = "PrCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrCoordinator"]

[observability]
enabled = true
